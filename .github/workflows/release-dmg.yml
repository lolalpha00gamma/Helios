      - name: Sign and make DMG
        run: |
          set -euo pipefail
          APP=".derived/Build/Products/Release/Helios.app"
          test -d "$APP"
          rm -rf dmgroot Helios.dmg
          mkdir dmgroot
          cp -R "$APP" dmgroot/Helios.app
          codesign --force --deep --sign - \
            --options runtime \
            --timestamp=none \
            --entitlements macos/Helios.entitlements \
            dmgroot/Helios.app
          codesign --verify --verbose=2 dmgroot/Helios.app || true
          ln -s /Applications dmgroot/Applications
          # Eine echte UDIF-Disk-Image-Datei, kein Zip, kein Ordner.
          hdiutil create \
            -volname Helios \
            -srcfolder dmgroot \
            -ov \
            -format UDZO \
            -fs HFS+ \
            -layout NONE \
            Helios.dmg
          test -f Helios.dmg
          test ! -d Helios.dmg
          file Helios.dmg
          hdiutil imageinfo Helios.dmg | head -n 20
          codesign --force --sign - --timestamp=none Helios.dmg || true
          ls -lh Helios.dmg

      - name: Publish Helios.dmg
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ steps.ver.outputs.tag }}"
          TITLE="${{ steps.ver.outputs.title }}"
          if [ ! -f Helios.dmg ] || [ -d Helios.dmg ]; then
            echo "Helios.dmg ist keine Datei" >&2
            exit 1
          fi
          NOTES="$(cat <<EOF
          ## Download

          Nur **Helios.dmg** herunterladen (Disk-Image).

          Nicht anfassen: *Source code (zip)* und *Source code (tar.gz)* — das ist Quelltext, nicht die App.

          1. Helios.dmg öffnen (Doppelklick)
          2. Helios nach Programme ziehen
          3. Rechtsklick → Öffnen (Gatekeeper)
          4. Kamera, Bedienungshilfen und Eingabeüberwachung erlauben

          Ad-hoc signiert. Developer-ID / Notarisierung braucht ein Apple-Zertifikat in den Repo-Secrets.
          EOF
          )"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TITLE" --notes "$NOTES" --latest
          else
            gh release create "$TAG" --title "$TITLE" --latest --notes "$NOTES"
          fi
          gh release delete-asset "$TAG" Helios.dmg --yes || true
          RID=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" --jq .id)
          gh api --method POST \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/x-apple-diskimage" \
            "/repos/${GITHUB_REPOSITORY}/releases/${RID}/assets?name=Helios.dmg&label=Helios.dmg" \
            --input Helios.dmg \
            --jq '{name,content_type,size,browser_download_url}'
