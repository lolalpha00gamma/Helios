name: Helios.dmg

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: echo ping && uname -a

  package:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          echo "Installed:"
          ls /Applications | grep -i xcode || true
          set +e
          PICK=""
          for p in \
            /Applications/Xcode_27.app \
            /Applications/Xcode_27.0.app \
            /Applications/Xcode_27.0.0.app \
            /Applications/Xcode_26.6.app \
            /Applications/Xcode_26.5.app \
            /Applications/Xcode_26.app \
            /Applications/Xcode.app
          do
            if [ -d "$p/Contents/Developer" ]; then
              PICK="$p"
              break
            fi
          done
          if [ -n "$PICK" ]; then
            sudo xcode-select -s "$PICK/Contents/Developer"
            echo "Using $PICK"
          fi
          xcodebuild -version
          xcrun --show-sdk-version

      - name: Read version
        id: ver
        run: |
          MARKETING=$(awk -F' = ' '/MARKETING_VERSION/{gsub(/;/, "", $2); print $2; exit}' macos/Helios.xcodeproj/project.pbxproj)
          TAG="v${MARKETING}"
          TITLE="Helios ${MARKETING}"
          echo "marketing=$MARKETING" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "title=$TITLE" >> "$GITHUB_OUTPUT"

      - name: Coord tests
        continue-on-error: true
        run: |
          swiftc macos/Helios/CoordMath.swift macos/HeliosTests/CoordTests.swift -o /tmp/coordtests
          /tmp/coordtests
          swiftc -framework Vision macos/Helios/GestureClassifier.swift macos/Helios/CoordMath.swift macos/HeliosTests/GestureTests.swift -o /tmp/gesturetests
          /tmp/gesturetests
          swiftc -framework AppKit macos/Helios/CoordMath.swift macos/Helios/ScreenGeometry.swift macos/Helios/SpaceMap.swift macos/HeliosTests/SpaceMapTests.swift -o /tmp/spacemaptests
          /tmp/spacemaptests

      - name: Build Helios.app
        run: |
          xcodebuild \
            -project macos/Helios.xcodeproj \
            -scheme Helios \
            -configuration Release \
            -derivedDataPath .derived \
            -destination 'platform=macOS,arch=arm64' \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            EXCLUDED_ARCHS=x86_64 \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=YES \
            CODE_SIGNING_ALLOWED=YES \
            ENABLE_HARDENED_RUNTIME=YES \
            build

      - name: Make Helios.dmg
        run: |
          set -euo pipefail
          APP=".derived/Build/Products/Release/Helios.app"
          test -d "$APP"
          rm -rf dmgroot Helios.dmg
          mkdir dmgroot
          cp -R "$APP" dmgroot/Helios.app
          codesign --force --sign - \
            --options runtime \
            --timestamp=none \
            --entitlements macos/Helios.entitlements \
            dmgroot/Helios.app
          ln -s /Applications dmgroot/Applications
          hdiutil create \
            -volname Helios \
            -srcfolder dmgroot \
            -ov \
            -format UDZO \
            -fs HFS+ \
            Helios.dmg
          test -f Helios.dmg
          test ! -d Helios.dmg
          file Helios.dmg
          ls -lh Helios.dmg
          defaults read "$APP/Contents/Info.plist" CFBundleShortVersionString
          defaults read "$APP/Contents/Info.plist" CFBundleVersion

      - name: Upload Helios.dmg artifact
        uses: actions/upload-artifact@v4
        with:
          name: Helios.dmg
          path: Helios.dmg
          if-no-files-found: error

      - name: Publish Helios.dmg
        if: github.event_name != 'pull_request' && github.repository == 'bpms9cmnxc-debug/Helios'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ steps.ver.outputs.tag }}"
          TITLE="${{ steps.ver.outputs.title }}"
          if [ ! -f Helios.dmg ] || [ -d Helios.dmg ]; then
            echo "Helios.dmg ist keine Datei" >&2
            exit 1
          fi
          NOTES="$(cat <<EOF
          ## Helios.dmg

          Nur **Helios.dmg**. Nicht Source code (zip) / tar.gz.

          1. Rechtsklick → Öffnen
          2. Nach Programme ziehen, alte App ersetzen
          3. Kamera, Bedienungshilfen, Eingabeüberwachung neu erlauben
          EOF
          )"
          git tag -a "$TAG" -m "$TITLE" 2>/dev/null || true
          git push origin "$TAG" || true
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TITLE" --notes "$NOTES" --latest || true
          else
            gh release create "$TAG" --title "$TITLE" --latest --notes "$NOTES"
          fi
          gh release upload "$TAG" Helios.dmg --clobber
          gh release view "$TAG"
