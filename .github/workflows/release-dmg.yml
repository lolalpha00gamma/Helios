name: Helios.dmg

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'AGENT.md'
      - 'CLAUDE.md'
      - 'agent.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: helios-dmg-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          echo "Installed:"
          ls /Applications | grep -i xcode || true
          set +e
          PICK=""
          for p in \
            /Applications/Xcode_27.app \
            /Applications/Xcode_27.0.app \
            /Applications/Xcode_27.0.0.app \
            /Applications/Xcode_26.6.app \
            /Applications/Xcode_26.5.app \
            /Applications/Xcode_26.app \
            /Applications/Xcode.app
          do
            if [ -d "$p/Contents/Developer" ]; then
              PICK="$p"
              break
            fi
          done
          if [ -n "$PICK" ]; then
            sudo xcode-select -s "$PICK/Contents/Developer"
            echo "Using $PICK"
          fi
          xcodebuild -version
          xcrun --show-sdk-version

      - name: Read version
        id: ver
        run: |
          MARKETING=$(awk -F' = ' '/MARKETING_VERSION/{gsub(/;/, "", $2); print $2; exit}' macos/Helios.xcodeproj/project.pbxproj)
          TAG="v${MARKETING}"
          TITLE="Helios ${MARKETING}"
          echo "marketing=$MARKETING" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "title=$TITLE" >> "$GITHUB_OUTPUT"

      - name: Coord tests
        run: |
          swiftc macos/Helios/CoordMath.swift macos/HeliosTests/CoordTests.swift -o /tmp/coordtests
          /tmp/coordtests
          swiftc -framework Vision -framework CoreML \
            macos/Helios/CoordMath.swift \
            macos/Helios/AspectSpace.swift \
            macos/Helios/HandEstimate.swift \
            macos/Helios/EstimateFusion.swift \
            macos/Helios/PoseHMM.swift \
            macos/Helios/GestureClassifier.swift \
            macos/Helios/TemporalNet.swift \
            macos/HeliosTests/GestureTests.swift \
            -o /tmp/gesturetests
          /tmp/gesturetests
          swiftc -framework AppKit macos/Helios/CoordMath.swift macos/Helios/ScreenGeometry.swift macos/Helios/SpaceMap.swift macos/HeliosTests/SpaceMapTests.swift -o /tmp/spacemaptests
          /tmp/spacemaptests

      - name: Import Developer ID certificate
        if: github.event_name != 'pull_request'
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${BUILD_CERTIFICATE_BASE64:-}" ] || [ -z "${P12_PASSWORD:-}" ]; then
            echo "Secrets BUILD_CERTIFICATE_BASE64 oder P12_PASSWORD fehlen." >&2
            exit 1
          fi
          echo "$BUILD_CERTIFICATE_BASE64" | base64 --decode > cert.p12
          security create-keychain -p actions build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p actions build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security import cert.p12 -k build.keychain -P "$P12_PASSWORD" -A -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k actions build.keychain
          security list-keychains -d user -s build.keychain login.keychain
          rm -f cert.p12
          security find-identity -p codesigning -v

      - name: Build Helios.app
        run: |
          xcodebuild \
            -project macos/Helios.xcodeproj \
            -scheme Helios \
            -configuration Release \
            -derivedDataPath .derived \
            -destination 'platform=macOS,arch=arm64' \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            EXCLUDED_ARCHS=x86_64 \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=YES \
            CODE_SIGNING_ALLOWED=YES \
            ENABLE_HARDENED_RUNTIME=YES \
            build

      - name: Sign app, make DMG, notarize
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          APP=".derived/Build/Products/Release/Helios.app"
          test -d "$APP"
          rm -rf dmgroot Helios.dmg
          mkdir dmgroot
          cp -R "$APP" dmgroot/Helios.app

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            codesign --force --sign - \
              --options runtime \
              --timestamp=none \
              --entitlements macos/Helios.entitlements \
              dmgroot/Helios.app
            ln -s /Applications dmgroot/Applications
            hdiutil create -volname Helios -srcfolder dmgroot -ov -format UDZO -fs HFS+ Helios.dmg
            exit 0
          fi

          IDENTITY=$(security find-identity -p codesigning -v | awk -F'"' '/Developer ID Application/{print $2; exit}')
          if [ -z "$IDENTITY" ]; then
            echo "Kein Developer ID Application Zertifikat im Keychain." >&2
            security find-identity -p codesigning -v || true
            exit 1
          fi
          echo "Signing as $IDENTITY"

          codesign --force --options runtime --timestamp \
            --entitlements macos/Helios.entitlements \
            --sign "$IDENTITY" \
            dmgroot/Helios.app
          codesign --verify --deep --strict --verbose=2 dmgroot/Helios.app

          ln -s /Applications dmgroot/Applications
          hdiutil create \
            -volname Helios \
            -srcfolder dmgroot \
            -ov \
            -format UDZO \
            -fs HFS+ \
            Helios.dmg
          test -f Helios.dmg

          codesign --force --timestamp --sign "$IDENTITY" Helios.dmg
          codesign --verify --verbose=2 Helios.dmg

          if [ -z "${APPLE_ID:-}" ] || [ -z "${APPLE_APP_PASSWORD:-}" ] || [ -z "${APPLE_TEAM_ID:-}" ]; then
            echo "APPLE_ID / APPLE_APP_PASSWORD / APPLE_TEAM_ID fehlen — Notarisierung übersprungen." >&2
            exit 1
          fi

          xcrun notarytool submit Helios.dmg \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait
          xcrun stapler staple Helios.dmg
          xcrun stapler validate Helios.dmg
          ls -lh Helios.dmg

      - name: Upload Helios.dmg artifact
        uses: actions/upload-artifact@v4
        with:
          name: Helios.dmg
          path: Helios.dmg
          if-no-files-found: error

      - name: Publish Helios.dmg
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ steps.ver.outputs.tag }}"
          TITLE="${{ steps.ver.outputs.title }}"
          if [ ! -f Helios.dmg ] || [ -d Helios.dmg ]; then
            echo "Helios.dmg ist keine Datei" >&2
            exit 1
          fi
          NOTES="$(cat <<EOF
          ## Download

          Nur **Helios.dmg** herunterladen (Disk-Image).

          Nicht anfassen: *Source code (zip)* und *Source code (tar.gz)* — das ist Quelltext, nicht die App.

          1. Helios.dmg öffnen (Doppelklick)
          2. Helios nach Programme ziehen
          3. Beim ersten Start ggf. Kamera, Bedienungshilfen und Eingabeüberwachung erlauben

          Signiert mit Developer ID und notarisiert.
          EOF
          )"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TITLE" --notes "$NOTES" --latest || true
          else
            gh release create "$TAG" --title "$TITLE" --latest --notes "$NOTES"
          fi
          gh release upload "$TAG" Helios.dmg --clobber
          gh release view "$TAG"
